<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <style>
      /* Fondo circular que resalta en pestañas claras u oscuras */
      .bg-circle {
        fill: #262e16; /* Índigo oscuro tipo Astro */
      }

      /* Estilo de la letra S en tono naranja vibrante */
      .s-letter {
        fill: none;
        stroke: #f97316; /* Naranja dinámico */
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      
    </style>
  </defs>

  <!-- Fondo circular -->
  <circle class="bg-circle" cx="16" cy="16" r="15" />

  <!-- Líneas que simulan movimiento / velocidad -->
  <path class="motion-line" d="M 5.5 10.5 L 8.5 10.5" />
  <path class="motion-line" d="M 4 16 L 8 16" />
  <path class="motion-line" d="M 6.5 21.5 L 9.5 21.5" />

  <!-- Trazo principal de la 'S' -->
  <path 
    class="s-letter" 
    d="M 23 10.5 
       C 23 8, 20.5 6.2, 17 6.2 
       C 12.8 6.2, 10.8 9.2, 10.8 12 
       C 10.8 16.2, 22.8 16.2, 22.8 20.2 
       C 22.8 23.2, 20.5 25.8, 16.2 25.8 
       C 12.5 25.8, 10 23.8, 10 21" 
  />
</svg>
